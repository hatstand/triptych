[project]
name = "triptych"
version = "0.1.0"
description = "A TripIt-style itinerary organiser powered by a local LLM and Restate"
requires-python = ">=3.13"
dependencies = [
    "restate-sdk[serde,client]==1.1.0",
    "hypercorn>=0.17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx[http2]>=0.28",
    "pydantic>=2.10",
    "aiosmtpd>=1.4.6",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "icalendar>=6.1",
    "watchfiles>=1.0",
    "dkimpy[arc]>=1.1.8",
    "dnspython>=2.9.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "ty==0.0.85",
    "squawk-cli==2.68.0",
    "playwright==1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triptych"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Trip names span months with an en dash ("November–December 2026").
allowed-confusables = ["–"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.rules]
# Treat every diagnostic as an error so `ty check` fails CI/Tilt on anything it finds.
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
