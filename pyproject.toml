[project]
name = "triptych"
version = "0.1.0"
description = "A TripIt-style itinerary organiser powered by a local LLM and Restate"
requires-python = ">=3.14"
dependencies = [
    "restate-sdk[serde,client]==1.2.0",
    "hypercorn>=0.17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx[http2]>=0.28",
    "pydantic>=2.10",
    "aiosmtpd>=1.4.6",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "icalendar>=6.1",
    "watchfiles>=1.0",
    "dkimpy[arc]>=1.1.8",
    "dnspython>=2.9.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "webauthn>=3.0.1",
    "pillow>=13.0.0",
    "limits>=5",
    "tink>=1.16.1",
    "boto3>=1.43.118",
    "python-json-logger>=4.2.0",
    "tzdata>=2026.5",
    "numpy>=2.5",
    "ollama>=0.6",
    "pillow-heif>=1.8.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "ty==0.0.85",
    "squawk-cli==2.68.0",
    "playwright==1.64.1",
    "moto[s3]>=5.2.4",
    "pydantic-evals>=2.61.0",
    "scipy>=1.18.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triptych"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PERF", "PIE", "RET", "PTH", "LOG", "G", "FURB", "RUF100"]
# Trip names span months with an en dash ("November–December 2026").
allowed-confusables = ["–"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "scripts", "evals"]

[tool.ty.rules]
# Treat every diagnostic as an error so `ty check` fails CI/Tilt on anything it finds.
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# `uv run pytest -m llm` runs the eval smoke set against a local Ollama (evals/README.md).
markers = ["llm: needs a local Ollama with the extraction model pulled"]
addopts = "-m 'not llm'"
