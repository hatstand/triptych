# Core stack. The LLM backend is layered on with one of the files in compose/ — see .env.example
# (COMPOSE_FILE) or the Tiltfile (`tilt up -- --llm=rocm|vulkan|nvidia|host`).
name: triptych

x-app: &app
  image: ${TRIPTYCH_IMAGE:-triptych-app}  # CI deploys set ghcr.io/hatstand/triptych:<sha>
  build: .
  restart: unless-stopped
  environment: &app-env
    RESTATE_INGRESS_URL: http://restate:8080
    DATABASE_URL: postgresql://triptych:${POSTGRES_PASSWORD:-triptych}@postgres:5432/triptych
    RESTATE_ADMIN_URL: http://restate:9070
    WORKER_PUBLIC_URL: http://worker:9080
    OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    LLM_MODEL: ${LLM_MODEL:-gemma4:26b-a4b-it-qat}
    LLM_NUM_CTX: ${LLM_NUM_CTX:-16384}
    LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
    WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
    SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    INBOUND_TOKEN: ${INBOUND_TOKEN:-}
    INBOUND_ALLOWED_SENDERS: ${INBOUND_ALLOWED_SENDERS:-}
    ADMIN_TAILSCALE_LOGINS: ${ADMIN_TAILSCALE_LOGINS:-}
    ADMIN_ORIGINS: ${ADMIN_ORIGINS:-}
    RESTATE_UI_URL: ${RESTATE_UI_URL:-}

x-after-migrations: &after-migrations
  restate:
    condition: service_started
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triptych
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triptych}
      POSTGRES_DB: triptych
    ports: ["${BIND_ADDR:-127.0.0.1}:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql   # PG 18 images keep PGDATA under a versioned subdir
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "triptych", "-d", "triptych"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Hand-written SQL migrations in db/migrations (lint: scripts/lint_migrations.py → squawk).
  # The app services wait for this to finish. Schema dumps (db/schema.sql) are made by the
  # Tiltfile / `scripts/dbmate.sh dump` so the file is owned by you, not root.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgresql://triptych:${POSTGRES_PASSWORD:-triptych}@postgres:5432/triptych?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  restate:
    image: docker.io/restatedev/restate:1.8.1
    restart: unless-stopped
    ports:
      # Host ports bind to loopback by default. compose/public.yaml drops this one entirely.
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"   # ingress
      # Admin API + UI. RESTATE_ADMIN_BIND can put just this on the tailnet; it has no auth.
      - "${RESTATE_ADMIN_BIND:-${BIND_ADDR:-127.0.0.1}}:9070:9070"
    environment:
      RESTATE_NODE_NAME: triptych
    volumes:
      - restate-data:/restate-data

  worker:
    <<: *app
    command: ["python", "-m", "triptych.worker"]
    depends_on: *after-migrations

  web:
    <<: *app
    # Live-update streams (/events) never finish on their own; cut them on shutdown so a deploy
    # doesn't wait out Docker's stop timeout. Browsers reconnect to the new process.
    command: ["uvicorn", "triptych.web.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers",
              "--timeout-graceful-shutdown", "2"]
    ports: ["${BIND_ADDR:-127.0.0.1}:8000:8000"]
    depends_on: *after-migrations

  # Tailscale-authorised admin pages. Unix socket only, so the identity headers can come from
  # nowhere but `tailscale serve` (see triptych/admin/app.py and deploy/README.md). Opt in with
  # COMPOSE_PROFILES=admin after creating ADMIN_SOCKET_DIR owned by uid 10001, mode 0700.
  admin:
    <<: *app
    profiles: [admin]
    command: ["uvicorn", "triptych.admin.app:app", "--uds", "/run/triptych/admin.sock"]
    volumes:
      - ${ADMIN_SOCKET_DIR:-./run}:/run/triptych
    depends_on: *after-migrations

  smtp:
    <<: *app
    command: ["python", "-m", "triptych.smtp"]
    ports: ["${BIND_ADDR:-127.0.0.1}:2525:2525"]
    depends_on: *after-migrations  # maps the sender's address to a user in Postgres

volumes:
  restate-data:
  postgres-data:
