<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>Triptych</title>
  <!-- Triptych's mark: three trip cards fanned out, in the rail, lodging and flight colours, with a
       plane on the front one. The gaps between cards are cut out (masks), not drawn in a background
       colour, so the mark works on any surface. -->
  <defs>
    <rect id="card" x="6" y="3.5" width="12" height="16" rx="2"/>
    <mask id="behind-front">
      <rect width="24" height="24" fill="#fff"/>
      <use href="#card" fill="#000" stroke="#000" stroke-width="1.5"/>
    </mask>
    <mask id="behind-both">
      <rect width="24" height="24" fill="#fff"/>
      <use href="#card" fill="#000" stroke="#000" stroke-width="1.5"/>
      <use href="#card" transform="rotate(18 12 20)" fill="#000" stroke="#000" stroke-width="1.5"/>
    </mask>
  </defs>
  <g mask="url(#behind-both)"><use href="#card" transform="rotate(-18 12 20)" fill="#0f7d6d"/></g>
  <g mask="url(#behind-front)"><use href="#card" transform="rotate(18 12 20)" fill="#7c4fc0"/></g>
  <use href="#card" fill="#f55f55"/>
  <path transform="translate(6.6 6) scale(.45)" fill="#fff" stroke="#fff" stroke-linejoin="round" d="M12 2c1.1 0 1.6 1.2 1.6 2.5V9l8.4 5v2l-8.4-2.6V19l2.6 1.8v1.6L12 21.5l-4.2.9v-1.6l2.6-1.8v-5.6L2 16v-2l8.4-5V4.5C10.4 3.2 10.9 2 12 2Z"/>
</svg>
