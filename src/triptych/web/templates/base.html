<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Triptych{% endblock %}</title>
  <link rel="stylesheet" href="{{ static('style.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ static('brand/mark.svg') }}">
  <link rel="apple-touch-icon" href="{{ static('brand/apple-touch-icon.png') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="{{ static('brand/mark.svg') }}" alt="" width="24" height="24">Triptych</a>
    {% if email %}
    <form method="post" action="/logout" class="who">
      <a href="/account">{{ email }}</a><button class="link">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% if email %}
  <div id="dropzone" class="dropzone" hidden>
    <div class="dropzone-panel"><b>Drop to add to Triptych</b>
      <span class="muted small">Emails (.eml), PDFs, screenshots, HTML or text</span></div>
  </div>
  <div id="drop-status" class="drop-status" role="status" hidden></div>
  <script type="module" src="{{ static('drop.ts') }}"></script>
  {% endif %}
</body>
</html>
