{% extends "base.html" %}
{% block content %}
<section class="card narrow stack">
  <h1>Sign in</h1>
  <p class="muted">Use the passkey you saved for Triptych on this device, your phone, or a security key.</p>
  <button type="button" data-passkey="login">Sign in with a passkey</button>
  <p class="error" data-passkey-error hidden></p>
  <p class="muted small">No account yet? Ask for an invite link.</p>
</section>
<script type="module" src="/static/js/passkey.js"></script>
{% endblock %}
