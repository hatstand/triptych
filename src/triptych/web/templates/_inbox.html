<h2>Inbox</h2>
{% for i in inbox %}
  <div class="inbox-item">
    <span class="badge {{ i.state }}">{{ i.state.replace('_', ' ') }}</span>
    <span class="label">{{ i.label }}</span>
    {% if i.message %}<div class="muted small">{{ i.message }}</div>{% endif %}
    {% for tid in i.trip_ids %}<a class="small" href="/trips/{{ tid }}">view trip →</a>{% endfor %}
  </div>
{% else %}<p class="muted small">Nothing processed yet.</p>{% endfor %}
