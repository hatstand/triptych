# NVIDIA dev box (needs nvidia-container-toolkit).
services:
  ollama:
    image: docker.io/ollama/ollama:${OLLAMA_TAG:-0.40.9}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  ollama-pull:
    image: docker.io/ollama/ollama:${OLLAMA_TAG:-0.40.9}
