# AMD Ryzen AI MAX (Strix Halo, Radeon 8050S/8060S = gfx1151) via ROCm. Default target.
services:
  ollama:
    image: docker.io/ollama/ollama:${OLLAMA_TAG:-0.40.9-rocm}
    devices:
      - /dev/kfd
      - /dev/dri
    # No group_add: Ollama runs as root in the container, so it can open the device nodes, and
    # group names resolve against the image's /etc/group, which has no `render` group.
    security_opt:
      - seccomp=unconfined
    environment:
      # Uncomment only if `docker compose logs ollama` says gfx1151 is unsupported / falls back to CPU.
      # HSA_OVERRIDE_GFX_VERSION: "11.5.1"
      OLLAMA_DEBUG: ${OLLAMA_DEBUG:-0}
