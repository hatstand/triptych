# Hardening for serving the UI on the internet (deploy/README.md → "Public access"); add to
# COMPOSE_FILE after the LLM files, followed by compose/direct.yaml, which publishes it.
#
# Takes away the host ports nothing on marvin needs, so none of them is one BIND_ADDR typo
# from the internet (Docker's published ports skip the host firewall). What stays, on loopback:
# proxy :8000 for `tailscale serve` (the ts.net name: /admin and its /static, and Funnel's /inbound
# until the Email Worker posts to the public host) and Restate :9070 for the Restate UI's Serve.
# Postgres is still reachable for backups with `docker compose exec postgres pg_dump ...`; with
# no published port, only compose neighbours (which hold DATABASE_URL anyway) can reach it.
# `!reset` / `!override` need Docker Compose 2.24.4 or later.

services:
  web:
    environment:
      # Client addresses for rate limits come from X-Forwarded-For (FORWARDED_ALLOW_IPS in
      # compose.yaml). On the public 443, proxy replaces whatever the visitor sent with the
      # connection's own address, so a forged header can't hide it.
      # Refuse to come up on the internet with the development default (the repo is public).
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env before serving publicly}

  postgres:
    ports: !reset []

  restate:
    ports: !override
      - "${RESTATE_ADMIN_BIND:-127.0.0.1}:9070:9070"

  ollama:
    ports: !reset []

  # Mail arrives over HTTPS at /inbound; the SMTP listener is for local testing only.
  smtp:
    ports: !reset []
