# AMD via Vulkan (RADV) instead of ROCm. On Strix Halo this is often as fast or faster for token
# generation and avoids ROCm version churn. Use the non-rocm image.
services:
  ollama:
    image: docker.io/ollama/ollama:${OLLAMA_TAG:-0.40.9}
    devices:
      - /dev/dri
    # No group_add: Ollama runs as root in the container, so it can open the device nodes, and
    # group names resolve against the image's /etc/group, which has no `render` group.
    environment:
      OLLAMA_VULKAN: "1"
  ollama-pull:
    image: docker.io/ollama/ollama:${OLLAMA_TAG:-0.40.9}
