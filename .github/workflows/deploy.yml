name: Deploy

# On every push to main: run the Python checks, build the app image into GHCR, then join the
# tailnet as an ephemeral tag:ci node (workload identity federation, no stored secret) and tell
# marvin to roll to it. Then run the eval gate against what was deployed (eval-gate.yml).
# One-time setup is in deploy/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-marvin
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/python.yml

  image:
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The eval harness on top of it, for the gate below.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: evals
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-evals
          cache-from: type=gha

  deploy:
    needs: image
    runs-on: ubuntu-26.04
    # The Tailscale federated identity trusts only this environment's subject, and the environment
    # only accepts deployments from main, so no other workflow or branch can reach the tailnet.
    environment: marvin
    permissions:
      id-token: write
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: marvin
      # deploy's login shell on marvin is deploy/triptych-deploy, which accepts only a commit SHA (or `gate`).
      - run: tailscale ssh deploy@marvin "$GITHUB_SHA"

  gate:
    needs: deploy
    uses: ./.github/workflows/eval-gate.yml
    permissions:
      id-token: write
      issues: write
