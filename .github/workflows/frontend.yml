name: Frontend

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # The app's stylesheet, formatted and linted by biome.json's CSS override (fix: npm run format:css).
      - name: CSS
        run: npm run check:css
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
