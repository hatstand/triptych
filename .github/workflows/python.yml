name: Python

# On main this runs as the first job of the Deploy workflow, so a failing check blocks the deploy.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    services:
      # For the DB and passkey tests, which build throwaway databases from db/schema.sql.
      postgres:
        image: docker.io/library/postgres:18.4-alpine
        env:
          POSTGRES_USER: triptych
          POSTGRES_PASSWORD: triptych
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triptych" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://triptych:triptych@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # Match the Dockerfile. Without a pin, uv picks the newest Python, which some dependencies (tink) have no wheels for.
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests scripts evals
      - name: Format
        run: uv run ruff format --check src tests scripts evals
      - name: Type check
        run: uv run ty check
      - name: Test
        run: uv run pytest -q
