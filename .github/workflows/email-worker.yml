name: Email Worker

on:
  pull_request:
    paths:
      - cloudflare/email-worker/**
      - .github/workflows/email-worker.yml
  push:
    branches: [main]
    paths:
      - cloudflare/email-worker/**
      - .github/workflows/email-worker.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cloudflare/email-worker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # `node --test` runs the .ts tests directly, which needs Node 22.18+ type stripping.
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/email-worker/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
